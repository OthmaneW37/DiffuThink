[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffuthink"
version = "0.2.0"
description = "StoryPatch: inspectable local rewriting with a from-scratch hybrid language model"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
research = ["tokenizers>=0.22,<0.23", "safetensors>=0.4", "requests>=2.31", "numpy>=1.26", "huggingface-hub>=0.34,<1"]
plots = ["matplotlib>=3.8"]

[project.scripts]
diffuthink = "diffuthink.cli:main"

[tool.setuptools.packages.find]
include = ["diffuthink*"]
